name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - config.yaml
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish add-on images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog needs history back to the previous release

      - name: Version
        id: version
        run: echo "value=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Publish aarch64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/canfie1d/aarch64-addon-mcp-host:${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

      - name: Publish amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/canfie1d/amd64-addon-mcp-host:${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

      - name: Record the released version
        run: |
          version="${{ steps.version.outputs.value }}"
          sed -i "s/^version: .*/version: \"${version}\"/" config.yaml
          # HA shows CHANGELOG.md on the update screen. List every commit since the previous
          # release commit, newest first, under the new version.
          prev=$(git log --format=%H -n1 --extended-regexp --grep='^Release [0-9]+\.[0-9]+\.[0-9]+$')
          notes=$(git log --no-merges --format='- %s' ${prev:+$prev..}HEAD | grep -vE '^- Release [0-9]' || true)
          [ -n "$notes" ] || notes="- Rebuilt with no code changes."
          { printf '# Changelog\n\n## %s\n\n%s\n\n' "$version" "$notes"; sed '1,2d' CHANGELOG.md; } > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.yaml CHANGELOG.md
          git commit -m "Release ${version}"
          git push origin HEAD:main
