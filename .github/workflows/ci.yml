name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - config.yaml
      - CHANGELOG.md

jobs:
  build:
    name: Build server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: find src -name '*.mjs' -print0 | xargs -0 -n1 node --check
